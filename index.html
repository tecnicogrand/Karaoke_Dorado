<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karaoke VocalMatch Optimized 🎤</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f19;
            color: #f8fafc;
            overflow-x: hidden;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        
        .lyric-container {
            max-height: 60vh;
            overflow-y: auto;
            scroll-behavior: smooth;
            mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
            padding-bottom: 50vh; /* Allow scrolling past the last line */
        }

        /* Lyrics Animations */
        .line-wrapper { transition: all 0.3s ease; opacity: 0.3; transform: scale(0.95); margin-bottom: 1.5rem; }
        .line-active { opacity: 1; transform: scale(1.05); }

        .word { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); display: inline-block; margin-right: 8px; padding: 2px 4px; border-radius: 6px; }
        .word-pending { color: #94a3b8; }
        .word-hit { color: #22c55e; font-weight: 900; text-shadow: 0 0 15px rgba(34, 197, 94, 0.8); transform: translateY(-4px) scale(1.1); }
        .word-miss { color: #ef4444; opacity: 0.4; text-decoration: line-through; }

        /* UI Effects */
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.3); opacity: 0; }
        }
        .mic-listening-ping::after {
            content: ''; position: absolute; left: 0; top: 0; right: 0; bottom: 0;
            border-radius: 50%; border: 2px solid #22c55e;
            animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        .search-result-item:hover { background-color: #1e293b; }
    </style>
</head>
<body class="min-h-screen flex flex-col p-4 md:p-6 bg-gradient-to-b from-slate-900 to-black">

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-5 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-xl shadow-2xl transition-all duration-300 z-50 opacity-0 pointer-events-none flex items-center gap-3 font-bold text-white">
        <span id="toast-icon">ℹ️</span>
        <span id="toast-msg">Mensaje</span>
    </div>

    <header class="w-full max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center mb-6 gap-4 border-b border-slate-800 pb-4">
        <div class="flex items-center gap-3">
            <span class="text-4xl filter drop-shadow-[0_0_10px_rgba(168,85,247,0.6)]">🎙️</span>
            <div>
                <h1 class="text-2xl md:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500 tracking-tight">Karaoke Optimized</h1>
                <p class="text-xs text-slate-400 font-semibold tracking-widest uppercase">Motor Levenshtein Time-Buffered</p>
            </div>
        </div>
        
        <div class="flex items-center gap-6 bg-slate-800/80 px-6 py-2 rounded-2xl border border-slate-700 shadow-xl">
            <div class="text-center">
                <p class="text-[10px] text-slate-400 uppercase font-bold tracking-widest">Aciertos</p>
                <p id="ui-hits" class="text-2xl font-black text-emerald-400">0</p>
            </div>
            <div class="w-px h-8 bg-slate-700"></div>
            <div class="text-center">
                <p class="text-[10px] text-slate-400 uppercase font-bold tracking-widest">Errores</p>
                <p id="ui-misses" class="text-2xl font-black text-red-400">0</p>
            </div>
            <div class="w-px h-8 bg-slate-700"></div>
            <div class="text-center">
                <p class="text-[10px] text-slate-400 uppercase font-bold tracking-widest">Precisión</p>
                <p class="text-3xl font-black text-white"><span id="ui-score">0</span><span class="text-lg text-slate-500">%</span></p>
            </div>
        </div>
    </header>

    <main class="flex-1 w-full max-w-7xl mx-auto flex flex-col lg:flex-row gap-6">
        
        <!-- Panel Izquierdo: Configuración, Búsqueda y Mic -->
        <div class="w-full lg:w-1/3 flex flex-col gap-4">
            
            <div class="bg-slate-800/60 backdrop-blur rounded-2xl border border-slate-700 p-5 shadow-xl flex flex-col gap-4">
                
                <!-- 1. Enlace de YouTube -->
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">1. Video de YouTube</label>
                    <input type="text" id="input-yt" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2.5 text-white focus:ring-2 focus:ring-purple-500 outline-none transition-all text-sm" value="https://www.youtube.com/watch?v=Jm2h7_1Qn1M" placeholder="https://youtube.com/watch?v=...">
                </div>

                <!-- 2. Buscador LRCLIB -->
                <div class="bg-slate-900/50 p-3 rounded-xl border border-slate-700 relative">
                    <label class="block text-xs font-bold text-purple-400 uppercase tracking-wider mb-2">2. Buscar Letra (LRCLIB)</label>
                    <div class="flex gap-2">
                        <input type="text" id="search-query" class="flex-1 bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-white focus:ring-2 focus:ring-purple-500 outline-none text-sm placeholder-slate-500" placeholder="Ej: Bad Bunny Ojitos Lindos">
                        <button id="btn-search" class="bg-purple-600 hover:bg-purple-500 text-white px-4 py-2 rounded-lg font-bold transition-colors text-sm shadow-lg">Buscar</button>
                    </div>
                    <p id="search-status" class="text-xs text-slate-400 mt-2 hidden"></p>
                    
                    <div id="search-results" class="hidden absolute left-0 right-0 top-full mt-2 bg-slate-800 border border-slate-600 rounded-xl shadow-2xl z-50 max-h-60 overflow-y-auto"></div>
                </div>

                <!-- 3. Área LRC -->
                <div class="flex flex-col">
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 flex justify-between items-end">
                        <span>3. Letra LRC Sincronizada</span>
                        <button id="btn-clear" class="text-pink-400 hover:text-pink-300 text-[10px]">Limpiar</button>
                    </label>
                    <textarea id="input-lrc" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-slate-300 h-28 focus:ring-2 focus:ring-purple-500 outline-none resize-none font-mono text-[11px] leading-relaxed" placeholder="Busca la letra arriba o pégala aquí..."></textarea>
                </div>
                
                <button id="btn-start" class="w-full mt-2 bg-gradient-to-r from-purple-500 to-pink-500 hover:from-purple-400 hover:to-pink-400 text-white font-black py-3 rounded-xl transition-all transform hover:scale-[1.02] shadow-lg shadow-purple-900/30 uppercase tracking-widest text-sm">
                    Iniciar Karaoke
                </button>
            </div>

            <!-- YouTube Iframe -->
            <div id="video-container" class="bg-black rounded-2xl border border-slate-700 aspect-video relative overflow-hidden shadow-xl hidden lg:block">
                <div id="player" class="w-full h-full absolute inset-0 z-0 hidden"></div>
                <div id="video-placeholder" class="absolute inset-0 bg-slate-900 flex flex-col items-center justify-center z-10">
                    <svg class="w-10 h-10 text-slate-600 mb-2 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <p class="text-slate-500 text-xs font-medium uppercase tracking-widest">Video en espera</p>
                </div>
            </div>

            <!-- Panel Estado del Micrófono (Resiliente) -->
            <div id="mic-panel" class="bg-slate-800 border border-slate-700 rounded-2xl p-4 transition-colors duration-300">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Motor de Voz</span>
                    <div class="relative flex items-center justify-center w-4 h-4">
                        <div id="mic-dot" class="w-3 h-3 rounded-full bg-slate-500 transition-colors duration-300 z-10"></div>
                    </div>
                </div>
                <p id="mic-status-text" class="text-sm font-black text-slate-300 mb-1">Inactivo / Pausado</p>
                <p id="mic-transcript" class="text-xs text-sky-400 italic truncate w-full">Esperando iniciar...</p>
            </div>
        </div>

        <!-- Panel Derecho: Letras -->
        <div class="w-full lg:w-2/3 bg-slate-800/40 backdrop-blur rounded-2xl border border-slate-700 p-6 flex flex-col shadow-2xl relative overflow-hidden min-h-[400px]">
            <div id="video-container-mobile" class="bg-black rounded-xl border border-slate-700 aspect-video relative overflow-hidden mb-6 lg:hidden hidden"></div>

            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-6 border-b border-slate-700/50 pb-2 text-center">🎤 Sigue la letra</h2>
            
            <div id="lyrics-display" class="lyric-container flex-1 flex flex-col items-center text-center pt-10">
                <div class="text-xl text-slate-500 opacity-50 font-medium mt-10">Configura el video y la letra para empezar.</div>
            </div>
        </div>
    </main>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        function showToast(msg, type = 'error') {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            const msgEl = document.getElementById('toast-msg');
            
            msgEl.textContent = msg;
            if (type === 'error') {
                toast.className = "fixed top-5 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-xl shadow-2xl transition-all duration-300 z-50 flex items-center gap-3 font-bold text-white bg-red-600 opacity-100";
                icon.textContent = "❌";
            } else {
                toast.className = "fixed top-5 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-xl shadow-2xl transition-all duration-300 z-50 flex items-center gap-3 font-bold text-white bg-emerald-600 opacity-100";
                icon.textContent = "✅";
            }

            setTimeout(() => { toast.classList.replace('opacity-100', 'opacity-0'); }, 4000);
        }

        // Levenshtein Distance Algorithm
        function getSimilarity(s1, s2) {
            if (s1 === s2) return 1.0;
            if (!s1 || !s2) return 0.0;
            const len1 = s1.length, len2 = s2.length;
            const matrix = Array(len2 + 1).fill().map(() => Array(len1 + 1).fill(0));
            for (let i = 0; i <= len1; i++) matrix[0][i] = i;
            for (let j = 0; j <= len2; j++) matrix[j][0] = j;
            for (let j = 1; j <= len2; j++) {
                for (let i = 1; i <= len1; i++) {
                    if (s1[i - 1] === s2[j - 1]) matrix[j][i] = matrix[j - 1][i - 1];
                    else matrix[j][i] = Math.min(matrix[j - 1][i - 1] + 1, matrix[j][i - 1] + 1, matrix[j - 1][i] + 1);
                }
            }
            return 1 - (matrix[len2][len1] / Math.max(len1, len2));
        }

        function normalizeStr(str) {
            return str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9ñ]/g, '');
        }

        const searchInput = document.getElementById('search-query');
        const btnSearch = document.getElementById('btn-search');
        const searchStatus = document.getElementById('search-status');
        const searchResultsContainer = document.getElementById('search-results');
        const lrcInput = document.getElementById('input-lrc');

        btnSearch.addEventListener('click', performLRCSearch);
        searchInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') performLRCSearch(); });

        async function performLRCSearch() {
            const query = searchInput.value.trim();
            if (!query) return;

            searchStatus.textContent = "Buscando...";
            searchStatus.className = "text-xs mt-2 text-sky-400 block";
            searchResultsContainer.innerHTML = '';
            searchResultsContainer.classList.add('hidden');

            try {
                const res = await fetch(`https://lrclib.net/api/search?q=${encodeURIComponent(query)}`);
                if (!res.ok) throw new Error("Error API");
                const data = await res.json();

                const syncedResults = data.filter(item => item.syncedLyrics);

                if (syncedResults.length === 0) {
                    searchStatus.textContent = "No hay letras sincronizadas para esta búsqueda.";
                    searchStatus.className = "text-xs mt-2 text-yellow-400 block";
                    return;
                }

                searchStatus.textContent = `Encontrados: ${syncedResults.length}`;
                searchStatus.className = "text-xs mt-2 text-emerald-400 block";

                syncedResults.forEach(item => {
                    const div = document.createElement('div');
                    div.className = "search-result-item p-3 border-b border-slate-700 cursor-pointer flex flex-col";
                    div.innerHTML = `<span class="text-sm font-bold text-white">${item.trackName}</span><span class="text-xs text-slate-400">${item.artistName}</span>`;
                    div.onclick = () => {
                        lrcInput.value = item.syncedLyrics;
                        searchResultsContainer.classList.add('hidden');
                        searchStatus.textContent = `Letra cargada: ${item.trackName}`;
                        searchStatus.className = "text-xs mt-2 text-purple-400 font-bold block";
                    };
                    searchResultsContainer.appendChild(div);
                });
                searchResultsContainer.classList.remove('hidden');
            } catch (error) {
                searchStatus.textContent = "Error al buscar en LRCLIB.";
                searchStatus.className = "text-xs mt-2 text-red-400 block";
            }
        }

        document.addEventListener('click', (e) => {
            if (!searchResultsContainer.contains(e.target) && e.target !== btnSearch && e.target !== searchInput) {
                searchResultsContainer.classList.add('hidden');
            }
        });
        document.getElementById('btn-clear').addEventListener('click', () => lrcInput.value = '');

        let player = null;
        let isYouTubeReady = false;
        let syncLoopId = null;
        let activeLineIndex = -1;
        
        // Structured lyrics memory
        let parsedLyrics = []; 
        let totalHits = 0;
        let totalMisses = 0;
        let totalScoreSum = 0;

        const DOM = {
            inputYt: document.getElementById('input-yt'),
            btnStart: document.getElementById('btn-start'),
            videoPlaceholder: document.getElementById('video-placeholder'),
            playerDiv: document.getElementById('player'),
            videoContainer: document.getElementById('video-container'),
            videoContainerMobile: document.getElementById('video-container-mobile'),
            lyricsDisplay: document.getElementById('lyrics-display'),
            uiScore: document.getElementById('ui-score'),
            uiHits: document.getElementById('ui-hits'),
            uiMisses: document.getElementById('ui-misses'),
            micPanel: document.getElementById('mic-panel'),
            micDot: document.getElementById('mic-dot'),
            micStatusText: document.getElementById('mic-status-text'),
            micTranscript: document.getElementById('mic-transcript')
        };

        function onYouTubeIframeAPIReady() { isYouTubeReady = true; }
        function extractVideoID(url) {
            const match = url.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i);
            return match ? match[1] : null;
        }

        let recognition = null;
        let keepMicAlive = false; 
        let isRecognizing = false;

        function initSpeechRecognition() {
            window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!window.SpeechRecognition) {
                updateMicUI("Navegador No Soportado", "red");
                showToast("Tu navegador no soporta Voz. Usa Chrome/Edge.");
                return;
            }

            recognition = new window.SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'es-MX';

            recognition.onstart = function() {
                isRecognizing = true;
                updateMicUI("🎤 Escuchando...", "green");
            };

            recognition.onresult = function(event) {
                let interim = '';
                let final = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) final += event.results[i][0].transcript;
                    else interim += event.results[i][0].transcript;
                }
                const transcript = final || interim;
                DOM.micTranscript.textContent = transcript;
                
                // Immediately evaluate the transcript
                evaluateLyricsTimeBuffered(transcript);
            };

            recognition.onerror = function(event) {
                if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                    keepMicAlive = false;
                    isRecognizing = false;
                    updateMicUI("Permiso Denegado", "red");
                    showToast("Permiso de micrófono denegado.");
                } else {
                    updateMicUI("Reconectando (Auto-Restart)...", "yellow");
                }
            };

            recognition.onend = function() {
                isRecognizing = false;
                if (keepMicAlive) {
                    updateMicUI("Reiniciando Motor...", "yellow");
                    setTimeout(() => {
                        if (keepMicAlive && !isRecognizing) {
                            try { recognition.start(); } catch (e) {}
                        }
                    }, 100); 
                } else {
                    updateMicUI("Inactivo / Pausado", "slate");
                    DOM.micTranscript.textContent = "...";
                }
            };
        }

        function updateMicUI(text, color) {
            DOM.micStatusText.textContent = text;
            DOM.micDot.className = "w-3 h-3 rounded-full z-10 transition-colors duration-300 absolute";
            DOM.micDot.parentElement.className = "relative flex items-center justify-center w-4 h-4";

            if (color === "green") {
                DOM.micPanel.className = "bg-emerald-900/20 border border-emerald-500/50 rounded-2xl p-4 transition-colors duration-300";
                DOM.micDot.classList.add("bg-emerald-500");
                DOM.micDot.parentElement.classList.add("mic-listening-ping");
            } else if (color === "yellow") {
                DOM.micPanel.className = "bg-yellow-900/20 border border-yellow-500/50 rounded-2xl p-4 transition-colors duration-300";
                DOM.micDot.classList.add("bg-yellow-500");
            } else if (color === "red") {
                DOM.micPanel.className = "bg-red-900/20 border border-red-500/50 rounded-2xl p-4 transition-colors duration-300";
                DOM.micDot.classList.add("bg-red-500");
            } else {
                DOM.micPanel.className = "bg-slate-800 border border-slate-700 rounded-2xl p-4 transition-colors duration-300";
                DOM.micDot.classList.add("bg-slate-500");
            }
        }

        DOM.btnStart.addEventListener('click', () => {
            const videoId = extractVideoID(DOM.inputYt.value);
            const lrcText = lrcInput.value.trim();

            if (!videoId) return showToast("Enlace de YouTube inválido.");
            if (!lrcText) return showToast("Pega o busca la letra LRC antes de iniciar.");
            if (!lrcText.includes('[')) return showToast("El texto no tiene formato [mm:ss]. Usa el buscador.");

            parseLrcToDom(lrcText);
            
            if (!recognition) initSpeechRecognition();

            const parent = window.innerWidth < 1024 ? DOM.videoContainerMobile : DOM.videoContainer;
            parent.appendChild(DOM.playerDiv);
            parent.classList.remove('hidden');

            DOM.videoPlaceholder.style.display = 'none';
            DOM.playerDiv.classList.remove('hidden');

            if (player) {
                player.loadVideoById(videoId);
            } else {
                player = new YT.Player('player', {
                    height: '100%', width: '100%', videoId: videoId,
                    playerVars: { 'playsinline': 1, 'controls': 1 },
                    events: {
                        'onReady': (e) => e.target.playVideo(),
                        'onStateChange': onPlayerStateChange
                    }
                });
            }
            showToast("¡Karaoke Listo! Dale Play al video.", "success");
        });

        window.addEventListener('resize', () => {
            if (player && document.getElementById('player') && !DOM.playerDiv.classList.contains('hidden')) {
                const parent = window.innerWidth < 1024 ? DOM.videoContainerMobile : DOM.videoContainer;
                if (DOM.playerDiv.parentElement !== parent) {
                    parent.appendChild(DOM.playerDiv);
                    parent.classList.remove('hidden');
                }
            }
        });

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                syncLoopId = requestAnimationFrame(lyricsSyncLoop);
                keepMicAlive = true;
                if (recognition && !isRecognizing) {
                    try { recognition.start(); } catch(e){}
                }
            } else {
                cancelAnimationFrame(syncLoopId);
                keepMicAlive = false;
                if (recognition && isRecognizing) { recognition.stop(); }
            }
        }

        function parseLrcToDom(lrcText) {
            DOM.lyricsDisplay.innerHTML = '';
            parsedLyrics = [];
            totalHits = 0;
            totalMisses = 0;
            totalScoreSum = 0;
            activeLineIndex = -1;
            updateScoreUI();

            const lines = lrcText.split('\n');
            const timeRegex = /\[(\d{2}):(\d{2}(?:\.\d{2,3})?)\](.*)/;

            lines.forEach((line) => {
                const match = line.match(timeRegex);
                if (match) {
                    const timeInSeconds = (parseInt(match[1]) * 60) + parseFloat(match[2]);
                    const rawLineText = match[3].trim();
                    if (!rawLineText) return;

                    const lineDiv = document.createElement('div');
                    lineDiv.className = "line-wrapper flex flex-wrap justify-center gap-x-3 gap-y-2 w-full max-w-3xl";
                    const wordsObjArray = [];
                    
                    if (!rawLineText.startsWith('(') && !rawLineText.startsWith('[')) {
                        const words = rawLineText.split(/\s+/);
                        words.forEach(w => {
                            const clean = normalizeStr(w);
                            if (clean) {
                                const span = document.createElement('span');
                                span.textContent = w;
                                span.className = "word word-pending text-2xl md:text-4xl lg:text-5xl font-black";
                                lineDiv.appendChild(span);
                                
                                // Each word holds its state and its line's timestamp
                                wordsObjArray.push({ 
                                    raw: w, 
                                    norm: clean, 
                                    time: timeInSeconds, 
                                    hit: false, 
                                    missed: false, 
                                    el: span 
                                });
                            }
                        });
                    } else {
                        lineDiv.innerHTML = `<span class="text-purple-400/80 italic text-xl md:text-3xl font-medium">${rawLineText}</span>`;
                    }

                    DOM.lyricsDisplay.appendChild(lineDiv);
                    parsedLyrics.push({ time: timeInSeconds, dom: lineDiv, words: wordsObjArray });
                }
            });
        }

        function lyricsSyncLoop() {
            if (!player) return;
            const currentTime = player.getCurrentTime();

            // 1. Highlight Active Line
            let targetIndex = -1;
            for (let i = parsedLyrics.length - 1; i >= 0; i--) {
                if (currentTime >= parsedLyrics[i].time - 0.2) {
                    targetIndex = i;
                    break;
                }
            }

            if (targetIndex !== -1 && targetIndex !== activeLineIndex) {
                if (activeLineIndex !== -1) {
                    parsedLyrics[activeLineIndex].dom.classList.remove('line-active');
                }
                activeLineIndex = targetIndex;
                const newLine = parsedLyrics[activeLineIndex];
                newLine.dom.classList.add('line-active');

                // Smooth scrolling
                const containerHalfHeight = DOM.lyricsDisplay.clientHeight / 2;
                const elementTop = newLine.dom.offsetTop;
                const elementHalfHeight = newLine.dom.clientHeight / 2;
                DOM.lyricsDisplay.scrollTo({
                    top: elementTop - containerHalfHeight + elementHalfHeight,
                    behavior: 'smooth'
                });
            }

            // 2. Mark Missed Words (Time Buffer Expiration)
            // If a line is older than 4 seconds from current time, its pending words are definitively missed.
            for (let i = 0; i < parsedLyrics.length; i++) {
                const line = parsedLyrics[i];
                if (currentTime > line.time + 4.0) {
                    let updated = false;
                    line.words.forEach(w => {
                        if (!w.hit && !w.missed) {
                            w.missed = true;
                            w.el.classList.replace('word-pending', 'word-miss');
                            totalMisses++;
                            updated = true;
                        }
                    });
                    if (updated) updateScoreUI();
                }
            }

            syncLoopId = requestAnimationFrame(lyricsSyncLoop);
        }

        function evaluateLyricsTimeBuffered(transcript) {
            if (!player) return;
            const currentTime = player.getCurrentTime();
            const spokenTokens = normalizeStr(transcript).split(/\s+/);

            // 1. Gather pending words in the 6-second window [-4.0s to +2.0s]
            let windowWords = [];
            for (let i = 0; i < parsedLyrics.length; i++) {
                const line = parsedLyrics[i];
                if (line.time >= currentTime - 4.0 && line.time <= currentTime + 2.0) {
                    line.words.forEach(w => {
                        if (!w.hit && !w.missed) windowWords.push(w);
                    });
                }
            }

            if (windowWords.length === 0) return;

            // 2. Evaluate tokens against window words
            spokenTokens.forEach(token => {
                if (token.length < 2) return;

                let bestMatch = null;
                let bestSim = 0;

                for (let i = 0; i < windowWords.length; i++) {
                    const targetWord = windowWords[i];
                    if (targetWord.hit || targetWord.missed) continue;

                    const sim = getSimilarity(token, targetWord.norm);
                    const threshold = targetWord.norm.length <= 3 ? 0.85 : 0.65;

                    if (sim >= threshold && sim > bestSim) {
                        bestSim = sim;
                        bestMatch = targetWord;
                        if (sim > 0.95) break; 
                    }
                }

                if (bestMatch) {
                    bestMatch.hit = true;
                    bestMatch.el.classList.replace('word-pending', 'word-hit');
                    
                    totalHits++;
                    totalScoreSum += bestSim;
                    updateScoreUI();
                }
            });
        }

        function updateScoreUI() {
            DOM.uiHits.textContent = totalHits;
            DOM.uiMisses.textContent = totalMisses;
            
            const processedWords = totalHits + totalMisses;
            if (processedWords > 0) {
                const score = Math.round((totalScoreSum / processedWords) * 100);
                DOM.uiScore.textContent = Math.min(100, score);
            } else {
                DOM.uiScore.textContent = "0";
            }
        }
    </script>
