<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karaoke Pro: Line-by-Line Phrasing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617; /* Slate 950 */
            color: #f8fafc;
            overflow-x: hidden;
        }

        /* Scrollbar aesthetics */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        /* Lyrics Container and Masking */
        .lyrics-container {
            max-height: 65vh;
            overflow-y: auto;
            scroll-behavior: smooth;
            padding-bottom: 50vh;
            padding-top: 10vh;
            mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
        }

        /* Line Styles & Transitions */
        .lyric-line {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0.3;
            transform: scale(0.95);
            margin-bottom: 1.5rem;
            cursor: default;
        }
        
        .lyric-line.active {
            opacity: 1;
            transform: scale(1.05);
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        /* Evaluated Line States */
        .lyric-line.eval-perfect { color: #4ade80; opacity: 0.8; } /* Green 400 */
        .lyric-line.eval-good { color: #facc15; opacity: 0.8; } /* Yellow 400 */
        .lyric-line.eval-bad { color: #f87171; opacity: 0.6; text-decoration: line-through; } /* Red 400 */
        .lyric-line.eval-instrumental { color: #38bdf8; opacity: 0.6; font-style: italic; } /* Sky 400 */

        /* Score Badge */
        .score-badge {
            transition: all 0.3s ease;
            display: inline-block;
            margin-left: 12px;
            font-size: 0.875rem;
            padding: 2px 8px;
            border-radius: 999px;
            font-weight: 700;
        }

        /* Mic Ping Animation */
        @keyframes ping-slow {
            75%, 100% { transform: scale(2); opacity: 0; }
        }
        .mic-active-ping::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background-color: #22c55e;
            animation: ping-slow 2s cubic-bezier(0, 0, 0.2, 1) infinite;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col p-4 md:p-6 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 to-black">

    <!-- Custom Toast Container -->
    <div id="toast-container" class="fixed top-5 left-1/2 transform -translate-x-1/2 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Header & Scoreboard -->
    <header class="w-full max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center mb-6 gap-4 border-b border-slate-800 pb-4">
        <div class="flex items-center gap-3">
            <span class="text-4xl filter drop-shadow-[0_0_10px_rgba(56,189,248,0.6)]">🎙️</span>
            <div>
                <h1 class="text-2xl md:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-indigo-500 tracking-tight">Karaoke Phrasing AI</h1>
                <p class="text-xs text-slate-400 font-bold tracking-widest uppercase">Evaluación Línea por Línea</p>
            </div>
        </div>
        
        <div class="flex items-center gap-6 bg-slate-800/80 px-6 py-2 rounded-2xl border border-slate-700 shadow-xl backdrop-blur-sm">
            <div class="text-center">
                <p class="text-[10px] text-slate-400 uppercase font-bold tracking-widest">Líneas Eval.</p>
                <p id="ui-lines" class="text-2xl font-black text-slate-300">0</p>
            </div>
            <div class="w-px h-8 bg-slate-700"></div>
            <div class="text-center">
                <p class="text-[10px] text-sky-400 uppercase font-bold tracking-widest">Precisión Global</p>
                <p class="text-3xl font-black text-white"><span id="ui-score">0</span><span class="text-lg text-slate-500">%</span></p>
            </div>
        </div>
    </header>

    <main class="flex-1 w-full max-w-7xl mx-auto flex flex-col lg:flex-row gap-6">
        
        <!-- Left Panel: Controls, Search, Video, Mic -->
        <div class="w-full lg:w-1/3 flex flex-col gap-4">
            
            <div class="bg-slate-800/60 backdrop-blur rounded-2xl border border-slate-700 p-5 shadow-xl flex flex-col gap-4">
                
                <!-- 1. YouTube Input -->
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">1. Video de YouTube</label>
                    <input type="text" id="input-yt" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2.5 text-white focus:ring-2 focus:ring-sky-500 outline-none transition-all text-sm" value="https://www.youtube.com/watch?v=sJ1120l9rB4" placeholder="https://youtube.com/watch?v=...">
                </div>

                <!-- 2. LRCLIB Search -->
                <div class="bg-slate-900/50 p-3 rounded-xl border border-slate-700 relative">
                    <label class="block text-xs font-bold text-sky-400 uppercase tracking-wider mb-2">2. Buscar Letra Automática</label>
                    <div class="flex gap-2">
                        <input type="text" id="search-query" class="flex-1 bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-white focus:ring-2 focus:ring-sky-500 outline-none text-sm placeholder-slate-500" placeholder="Ej: Maná Rayando el Sol">
                        <button id="btn-search" class="bg-sky-600 hover:bg-sky-500 text-white px-4 py-2 rounded-lg font-bold transition-colors text-sm shadow-lg">Buscar</button>
                    </div>
                    <!-- Search Results Dropdown -->
                    <div id="search-results" class="hidden absolute left-0 right-0 top-full mt-2 bg-slate-800 border border-slate-600 rounded-xl shadow-2xl z-50 max-h-60 overflow-y-auto"></div>
                </div>

                <!-- 3. LRC Textarea -->
                <div class="flex flex-col">
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 flex justify-between items-end">
                        <span>3. Letra LRC (Edición Manual)</span>
                        <button id="btn-clear" class="text-slate-500 hover:text-red-400 text-[10px] uppercase font-bold transition-colors">Limpiar</button>
                    </label>
                    <textarea id="input-lrc" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-slate-300 h-28 focus:ring-2 focus:ring-sky-500 outline-none resize-none font-mono text-[11px] leading-relaxed" placeholder="[00:00.00] Usa el buscador o pega tu letra aquí..."></textarea>
                </div>
                
                <button id="btn-start" class="w-full mt-2 bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-400 hover:to-indigo-500 text-white font-black py-3 rounded-xl transition-all transform hover:scale-[1.02] shadow-lg shadow-sky-900/20 uppercase tracking-widest text-sm">
                    Preparar y Cantar
                </button>
            </div>

            <!-- YouTube Video Container -->
            <div id="video-container" class="bg-black rounded-2xl border border-slate-700 aspect-video relative overflow-hidden shadow-xl">
                <div id="player" class="w-full h-full absolute inset-0 z-0 hidden"></div>
                <div id="video-placeholder" class="absolute inset-0 bg-slate-900 flex flex-col items-center justify-center z-10 transition-opacity duration-300">
                    <svg class="w-10 h-10 text-slate-600 mb-2 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    <p class="text-slate-500 text-xs font-medium uppercase tracking-widest">Reproductor</p>
                </div>
            </div>

            <!-- Aggressive Mic Status Panel -->
            <div id="mic-panel" class="bg-slate-800 border border-slate-700 rounded-2xl p-4 transition-colors duration-300 shadow-lg">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Motor de Voz (Keep-Alive)</span>
                    <div class="relative flex items-center justify-center w-4 h-4">
                        <div id="mic-dot" class="w-3 h-3 rounded-full bg-slate-500 transition-colors duration-300 z-10"></div>
                    </div>
                </div>
                <p id="mic-status-text" class="text-sm font-black text-slate-300 mb-1">Inactivo</p>
                <p id="mic-transcript" class="text-xs text-sky-400 italic truncate w-full">Esperando inicio...</p>
            </div>
        </div>

        <!-- Right Panel: Phrasing Lyrics Display -->
        <div class="w-full lg:w-2/3 bg-slate-800/40 backdrop-blur rounded-2xl border border-slate-700 p-6 flex flex-col shadow-2xl relative overflow-hidden min-h-[400px]">
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-6 border-b border-slate-700/50 pb-2 text-center flex justify-center items-center gap-2">
                <span>🎤 Letra Sincronizada</span>
            </h2>
            
            <div id="lyrics-display" class="lyrics-container flex-1 flex flex-col items-center text-center">
                <div class="text-xl text-slate-500 opacity-50 font-medium mt-20">Configura la pista para comenzar.</div>
            </div>
        </div>
    </main>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // --- UI TOAST SYSTEM ---
        function showToast(msg, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let bg = 'bg-slate-800', border = 'border-slate-700', icon = 'ℹ️';
            if (type === 'error') { bg = 'bg-red-900/90'; border = 'border-red-500'; icon = '❌'; }
            else if (type === 'success') { bg = 'bg-emerald-900/90'; border = 'border-emerald-500'; icon = '✅'; }

            toast.className = `${bg} border ${border} px-6 py-3 rounded-xl shadow-2xl transition-all duration-300 flex items-center gap-3 font-bold text-white transform translate-y-[-20px] opacity-0 backdrop-blur-md`;
            toast.innerHTML = `<span>${icon}</span><span>${msg}</span>`;
            
            container.appendChild(toast);
            
            // Animate In
            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-[-20px]', 'opacity-0');
            });

            // Animate Out & Remove
            setTimeout(() => {
                toast.classList.add('opacity-0', 'scale-95');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        // --- LRCLIB SEARCH LOGIC ---
        const UI = {
            searchQuery: document.getElementById('search-query'),
            btnSearch: document.getElementById('btn-search'),
            searchResults: document.getElementById('search-results'),
            inputLrc: document.getElementById('input-lrc'),
            inputYt: document.getElementById('input-yt'),
            btnClear: document.getElementById('btn-clear')
        };

        UI.btnSearch.addEventListener('click', performLRCSearch);
        UI.searchQuery.addEventListener('keypress', (e) => { if(e.key === 'Enter') performLRCSearch(); });
        UI.btnClear.addEventListener('click', () => { UI.inputLrc.value = ''; showToast('Letra limpiada', 'info'); });

        async function performLRCSearch() {
            const query = UI.searchQuery.value.trim();
            if (!query) return showToast("Escribe una canción para buscar.", "error");

            UI.searchResults.innerHTML = '<div class="p-4 text-center text-sky-400 text-sm font-bold">Buscando...</div>';
            UI.searchResults.classList.remove('hidden');

            try {
                const res = await fetch(`https://lrclib.net/api/search?q=${encodeURIComponent(query)}`);
                if (!res.ok) throw new Error("API Error");
                const data = await res.json();

                const syncedResults = data.filter(item => item.syncedLyrics);

                if (syncedResults.length === 0) {
                    UI.searchResults.innerHTML = '<div class="p-4 text-center text-yellow-400 text-sm">No hay letras sincronizadas (LRC) para esto.</div>';
                    return;
                }

                UI.searchResults.innerHTML = '';
                syncedResults.forEach(item => {
                    const div = document.createElement('div');
                    div.className = "p-3 border-b border-slate-700 cursor-pointer hover:bg-slate-700 transition-colors flex flex-col";
                    div.innerHTML = `<span class="text-sm font-bold text-white">${item.trackName}</span><span class="text-xs text-slate-400">${item.artistName}</span>`;
                    div.onclick = () => {
                        UI.inputLrc.value = item.syncedLyrics;
                        UI.searchResults.classList.add('hidden');
                        showToast(`Cargado: ${item.trackName}`, "success");
                    };
                    UI.searchResults.appendChild(div);
                });
            } catch (error) {
                UI.searchResults.innerHTML = '<div class="p-4 text-center text-red-400 text-sm">Error de conexión.</div>';
            }
        }

        // Close search dropdown on outside click
        document.addEventListener('click', (e) => {
            if (!UI.searchResults.contains(e.target) && e.target !== UI.btnSearch && e.target !== UI.searchQuery) {
                UI.searchResults.classList.add('hidden');
            }
        });

        let player = null;
        let isYouTubeReady = false;
        let syncLoopId = null;
        
        // Data Structures for Phrasing Logic
        let parsedLyrics = []; // { time, text, words:[], score: null, domLine }
        let activeLineIndex = -1;
        
        // Buffers for current active line
        let currentLineSpeechBuffer = ""; 
        let globalLinesEvaluated = 0;
        let globalScoreSum = 0;

        // Levenshtein & Normalization Helpers
        function normalizeStr(str) {
            return str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9ñ]/g, '');
        }

        function getFuzzySimilarity(expected, spoken) {
            if (expected === spoken) return 1.0;
            if (!expected || !spoken) return 0.0;
            const len1 = expected.length, len2 = spoken.length;
            const matrix = Array(len2 + 1).fill().map(() => Array(len1 + 1).fill(0));
            
            for (let i = 0; i <= len1; i++) matrix[0][i] = i;
            for (let j = 0; j <= len2; j++) matrix[j][0] = j;
            
            for (let j = 1; j <= len2; j++) {
                for (let i = 1; i <= len1; i++) {
                    if (expected[i - 1] === spoken[j - 1]) matrix[j][i] = matrix[j - 1][i - 1];
                    else matrix[j][i] = Math.min(matrix[j - 1][i - 1] + 1, matrix[j][i - 1] + 1, matrix[j - 1][i] + 1);
                }
            }
            return 1 - (matrix[len2][len1] / Math.max(len1, len2));
        }

        // --- LINE-BY-LINE EVALUATION ENGINE ---
        function evaluateLinePhrasing(lineIndex, speechText) {
            if (lineIndex < 0 || lineIndex >= parsedLyrics.length) return;
            const line = parsedLyrics[lineIndex];
            
            // Skip pure instrumentals or notes
            if (line.words.length === 0) {
                line.domLine.classList.add('eval-instrumental');
                return;
            }

            const spokenTokens = normalizeStr(speechText).split(/\s+/).filter(t => t.length > 0);
            
            let lineTotalSim = 0;

            // For every expected word in the line, find its best match in what was spoken
            line.words.forEach(expectedWord => {
                let bestMatchScore = 0;
                
                spokenTokens.forEach(spokenToken => {
                    const sim = getFuzzySimilarity(expectedWord, spokenToken);
                    if (sim > bestMatchScore) bestMatchScore = sim;
                });
                
                // Penalize heavily if the best match is too low to prevent false positives
                if (bestMatchScore < 0.4) bestMatchScore = 0; 
                lineTotalSim += bestMatchScore;
            });

            // Calculate 0-100 score for this specific line
            const lineScore = Math.round((lineTotalSim / line.words.length) * 100);
            line.score = lineScore;

            // Update Line UI
            line.domLine.classList.remove('active');
            let badgeClass = 'bg-slate-700 text-slate-300';
            
            if (lineScore >= 80) {
                line.domLine.classList.add('eval-perfect');
                badgeClass = 'bg-green-500/20 text-green-400 border border-green-500/30';
            } else if (lineScore >= 50) {
                line.domLine.classList.add('eval-good');
                badgeClass = 'bg-yellow-500/20 text-yellow-400 border border-yellow-500/30';
            } else {
                line.domLine.classList.add('eval-bad');
                badgeClass = 'bg-red-500/20 text-red-400 border border-red-500/30';
            }

            // Append Score Badge to the line
            const badge = document.createElement('span');
            badge.className = `score-badge ${badgeClass}`;
            badge.textContent = `${lineScore}%`;
            line.domLine.appendChild(badge);

            // Update Global Stats
            globalLinesEvaluated++;
            globalScoreSum += lineScore;
            const avgScore = Math.round(globalScoreSum / globalLinesEvaluated);
            
            document.getElementById('ui-lines').textContent = globalLinesEvaluated;
            document.getElementById('ui-score').textContent = avgScore;
        }

        let recognition = null;
        let isVideoPlaying = false; // Source of truth for Keep-Alive
        let isRecognizing = false;

        function initSpeechRecognition() {
            window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!window.SpeechRecognition) {
                showToast("Tu navegador no soporta Voz. Usa Chrome/Edge.", "error");
                return;
            }

            recognition = new window.SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'es-MX';

            const micPanel = document.getElementById('mic-panel');
            const micDot = document.getElementById('mic-dot');
            const micText = document.getElementById('mic-status-text');
            const micTranscript = document.getElementById('mic-transcript');

            recognition.onstart = () => {
                isRecognizing = true;
                micPanel.className = "bg-emerald-900/20 border border-emerald-500/50 rounded-2xl p-4 transition-colors duration-300 shadow-lg";
                micText.textContent = "Escuchando (Activo)";
                micText.className = "text-sm font-black text-emerald-400 mb-1";
                micDot.className = "w-3 h-3 rounded-full bg-emerald-500 z-10 transition-colors duration-300 absolute";
                micDot.parentElement.classList.add("mic-active-ping");
            };

            recognition.onresult = (e) => {
                let interim = "";
                let newFinals = "";
                
                for (let i = e.resultIndex; i < e.results.length; ++i) {
                    if (e.results[i].isFinal) newFinals += e.results[i][0].transcript + " ";
                    else interim += e.results[i][0].transcript + " ";
                }
                
                // Append guaranteed final words to our current line buffer
                if (newFinals) currentLineSpeechBuffer += newFinals;
                
                micTranscript.textContent = currentLineSpeechBuffer + interim;
            };

            recognition.onerror = (e) => {
                // Ignore soft errors that cause disconnects (Keep-alive handles reconnection)
                if (e.error === 'not-allowed') {
                    isVideoPlaying = false; 
                    showToast("Permiso de micrófono denegado.", "error");
                    micText.textContent = "Permiso Denegado";
                    micPanel.className = "bg-red-900/20 border border-red-500/50 rounded-2xl p-4 transition-colors duration-300 shadow-lg";
                    micDot.className = "w-3 h-3 rounded-full bg-red-500 z-10 absolute";
                    micDot.parentElement.classList.remove("mic-active-ping");
                }
            };

            recognition.onend = () => {
                isRecognizing = false;
                
                // THE AGGRESSIVE KEEP-ALIVE
                if (isVideoPlaying) {
                    micText.textContent = "Auto-Reinicio...";
                    micText.className = "text-sm font-black text-yellow-400 mb-1";
                    micPanel.className = "bg-yellow-900/20 border border-yellow-500/50 rounded-2xl p-4 transition-colors duration-300 shadow-lg";
                    micDot.className = "w-3 h-3 rounded-full bg-yellow-500 z-10 absolute";
                    micDot.parentElement.classList.remove("mic-active-ping");

                    setTimeout(() => {
                        if (isVideoPlaying && !isRecognizing) {
                            try { recognition.start(); } catch(err) {}
                        }
                    }, 150); // Fast restart
                } else {
                    micText.textContent = "Inactivo / Pausado";
                    micText.className = "text-sm font-black text-slate-300 mb-1";
                    micPanel.className = "bg-slate-800 border border-slate-700 rounded-2xl p-4 transition-colors duration-300 shadow-lg";
                    micDot.className = "w-3 h-3 rounded-full bg-slate-500 z-10 absolute";
                    micDot.parentElement.classList.remove("mic-active-ping");
                    micTranscript.textContent = "...";
                }
            };
        }

        function onYouTubeIframeAPIReady() { isYouTubeReady = true; }
        
        function extractVideoID(url) {
            const match = url.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i);
            return match ? match[1] : null;
        }

        document.getElementById('btn-start').addEventListener('click', () => {
            const videoId = extractVideoID(UI.inputYt.value);
            const lrcText = UI.inputLrc.value.trim();

            if (!videoId) return showToast("Enlace de YouTube inválido.", "error");
            if (!lrcText) return showToast("Pega o busca la letra LRC antes de iniciar.", "error");
            if (!lrcText.includes('[')) return showToast("El texto no tiene formato [mm:ss].", "error");

            parseLrcToDom(lrcText);
            
            if (!recognition) initSpeechRecognition();

            document.getElementById('video-placeholder').style.opacity = '0';
            setTimeout(() => document.getElementById('video-placeholder').style.display = 'none', 300);
            document.getElementById('player').classList.remove('hidden');

            if (player) {
                player.loadVideoById(videoId);
            } else {
                player = new YT.Player('player', {
                    height: '100%', width: '100%', videoId: videoId,
                    playerVars: { 'playsinline': 1, 'controls': 1 },
                    events: {
                        'onReady': (e) => e.target.playVideo(),
                        'onStateChange': onPlayerStateChange
                    }
                });
            }
            showToast("¡Pista Lista! Procesando voces...", "success");
        });

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                isVideoPlaying = true;
                syncLoopId = requestAnimationFrame(syncLoop);
                
                // Trigger Keep-Alive
                if (recognition && !isRecognizing) {
                    try { recognition.start(); } catch(e){}
                }
            } else {
                isVideoPlaying = false;
                cancelAnimationFrame(syncLoopId);
                if (recognition && isRecognizing) recognition.stop();
                
                // If video ends, evaluate the very last line
                if (event.data === YT.PlayerState.ENDED && activeLineIndex !== -1) {
                    evaluateLinePhrasing(activeLineIndex, currentLineSpeechBuffer);
                    activeLineIndex = -1;
                }
            }
        }

        function parseLrcToDom(lrcText) {
            const container = document.getElementById('lyrics-display');
            container.innerHTML = '';
            
            parsedLyrics = [];
            globalLinesEvaluated = 0;
            globalScoreSum = 0;
            activeLineIndex = -1;
            currentLineSpeechBuffer = "";
            
            document.getElementById('ui-lines').textContent = "0";
            document.getElementById('ui-score').textContent = "0";

            const lines = lrcText.split('\n');
            const timeRegex = /\[(\d{2}):(\d{2}(?:\.\d{2,3})?)\](.*)/;

            lines.forEach((line) => {
                const match = line.match(timeRegex);
                if (match) {
                    const timeInSeconds = (parseInt(match[1]) * 60) + parseFloat(match[2]);
                    const rawLineText = match[3].trim();
                    if (!rawLineText) return;

                    const lineDiv = document.createElement('div');
                    lineDiv.className = "lyric-line text-2xl md:text-4xl lg:text-5xl font-black";
                    lineDiv.textContent = rawLineText;
                    
                    const wordsArray = [];
                    // Extract words for evaluation if not an instrumental tag
                    if (!rawLineText.startsWith('(') && !rawLineText.startsWith('[')) {
                        rawLineText.split(/\s+/).forEach(w => {
                            const clean = normalizeStr(w);
                            if (clean) wordsArray.push(clean);
                        });
                    }

                    container.appendChild(lineDiv);
                    parsedLyrics.push({ 
                        time: timeInSeconds, 
                        text: rawLineText, 
                        words: wordsArray, 
                        score: null,
                        domLine: lineDiv 
                    });
                }
            });
        }

        function syncLoop() {
            if (!player) return;
            const currentTime = player.getCurrentTime();

            // Find current active line based on time
            let targetIndex = -1;
            for (let i = parsedLyrics.length - 1; i >= 0; i--) {
                // Add tiny offset for visual sync anticipation
                if (currentTime >= parsedLyrics[i].time - 0.2) {
                    targetIndex = i;
                    break;
                }
            }

            // Detect Line Change
            if (targetIndex !== -1 && targetIndex !== activeLineIndex) {
                
                // 1. Evaluate the PREVIOUS line that just finished
                if (activeLineIndex !== -1) {
                    // Extract text from the mic logic UI element to ensure we get late-arriving interim results too
                    const finalBufferToEval = currentLineSpeechBuffer + " " + document.getElementById('mic-transcript').textContent;
                    evaluateLinePhrasing(activeLineIndex, finalBufferToEval);
                }

                // 2. Clear buffers for the NEW line
                currentLineSpeechBuffer = "";
                if(isRecognizing) {
                    // Stopping and starting instantly clears the internal Web Speech API results array,
                    // giving us a completely clean slate for the next line's buffer.
                    recognition.stop(); 
                }

                // 3. Activate the NEW line visually
                activeLineIndex = targetIndex;
                const newLine = parsedLyrics[activeLineIndex];
                newLine.domLine.classList.add('active');

                // Smooth scrolling to center the active line
                const container = document.getElementById('lyrics-display');
                const containerHalfHeight = container.clientHeight / 2;
                const elementTop = newLine.domLine.offsetTop;
                const elementHalfHeight = newLine.domLine.clientHeight / 2;
                container.scrollTo({
                    top: elementTop - containerHalfHeight + elementHalfHeight,
                    behavior: 'smooth'
                });
            }

            syncLoopId = requestAnimationFrame(syncLoop);
        }
    </script>
</body>
</html>
