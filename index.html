<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karaoke Master Resilient AI 🎤</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f19; /* Tailwind slate-950/900 mix */
            color: #f8fafc;
            overflow-x: hidden;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        
        .lyric-container {
            max-height: 55vh;
            overflow-y: auto;
            scroll-behavior: smooth;
            mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
        }

        /* Animación y estado de las letras */
        .line-wrapper { transition: all 0.3s ease; opacity: 0.3; transform: scale(0.95); margin-bottom: 1.5rem; }
        .line-active { opacity: 1; transform: scale(1.05); }

        .word { transition: all 0.2s ease; display: inline-block; margin-right: 8px; padding: 2px 4px; border-radius: 6px; }
        .word-pending { color: #94a3b8; }
        .word-hit { color: #22c55e; font-weight: 900; text-shadow: 0 0 12px rgba(34, 197, 94, 0.6); transform: translateY(-2px) scale(1.1); }
        .word-miss { color: #ef4444; opacity: 0.5; text-decoration: line-through; }

        /* Efectos UI */
        .neon-box {
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.1), inset 0 0 10px rgba(56, 189, 248, 0.05);
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.3); opacity: 0; }
        }
        .mic-listening-ping::after {
            content: ''; position: absolute; left: 0; top: 0; right: 0; bottom: 0;
            border-radius: 50%; border: 2px solid #22c55e;
            animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col p-4 md:p-6 bg-gradient-to-b from-slate-900 to-black">

    <header class="w-full max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center mb-6 gap-4 border-b border-slate-800 pb-4">
        <div class="flex items-center gap-3">
            <span class="text-4xl filter drop-shadow-[0_0_10px_rgba(56,189,248,0.6)]">🎙️</span>
            <div>
                <h1 class="text-2xl md:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-emerald-400 tracking-tight">Karaoke Ultimate AI</h1>
                <p class="text-xs text-slate-400 font-semibold tracking-widest uppercase">Motor Anti-Cortes Activado</p>
            </div>
        </div>
        
        <div class="flex items-center gap-6 bg-slate-800/80 px-6 py-2 rounded-2xl border border-slate-700 shadow-xl">
            <div class="text-center">
                <p class="text-[10px] text-slate-400 uppercase font-bold tracking-widest">Aciertos</p>
                <p id="ui-hits" class="text-2xl font-black text-emerald-400">0</p>
            </div>
            <div class="w-px h-8 bg-slate-700"></div>
            <div class="text-center">
                <p class="text-[10px] text-slate-400 uppercase font-bold tracking-widest">Puntaje Global</p>
                <p class="text-3xl font-black text-white"><span id="ui-score">0</span><span class="text-lg text-slate-500">%</span></p>
            </div>
        </div>
    </header>

    <main class="flex-1 w-full max-w-7xl mx-auto flex flex-col lg:flex-row gap-6">
        
        <!-- Panel Izquierdo: Config, Video y Mic Estado -->
        <div class="w-full lg:w-1/3 flex flex-col gap-4">
            
            <div class="bg-slate-800/60 backdrop-blur rounded-2xl border border-slate-700 p-5 shadow-xl">
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">1. Video de YouTube</label>
                <input type="text" id="input-yt" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2.5 text-white mb-4 focus:ring-2 focus:ring-sky-500 outline-none transition-all text-sm" value="https://www.youtube.com/watch?v=tNqLd8P2oU8" placeholder="https://youtube.com/watch?v=...">
                
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 flex justify-between">
                    <span>2. Letra en formato LRC</span>
                    <button id="btn-clear" class="text-sky-400 hover:text-sky-300 text-[10px]">Limpiar</button>
                </label>
                <textarea id="input-lrc" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-slate-300 h-32 focus:ring-2 focus:ring-sky-500 outline-none resize-none font-mono text-[11px] leading-relaxed mb-4" placeholder="[00:00.00] Pega la letra sincronizada aquí..."></textarea>
                
                <button id="btn-start" class="w-full bg-gradient-to-r from-sky-500 to-emerald-500 hover:from-sky-400 hover:to-emerald-400 text-white font-black py-3 rounded-xl transition-all transform hover:scale-[1.02] shadow-lg shadow-sky-900/30 uppercase tracking-widest text-sm">
                    Iniciar Karaoke
                </button>
            </div>

            <!-- YouTube Iframe Container -->
            <div id="video-container" class="bg-black rounded-2xl border border-slate-700 aspect-video relative overflow-hidden shadow-xl">
                <div id="player" class="w-full h-full absolute inset-0 z-0 hidden"></div>
                <div id="video-placeholder" class="absolute inset-0 bg-slate-900 flex flex-col items-center justify-center z-10">
                    <svg class="w-10 h-10 text-slate-600 mb-2 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <p class="text-slate-500 text-xs font-medium uppercase tracking-widest">Video en espera</p>
                </div>
            </div>

            <!-- Panel de Estado del Micrófono Altamente Resiliente -->
            <div id="mic-panel" class="bg-slate-800 border border-slate-700 rounded-2xl p-4 transition-colors duration-300">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Estado del Micrófono</span>
                    <div class="relative flex items-center justify-center w-4 h-4">
                        <div id="mic-dot" class="w-3 h-3 rounded-full bg-slate-500 transition-colors duration-300 z-10"></div>
                    </div>
                </div>
                <p id="mic-status-text" class="text-sm font-black text-slate-300 mb-1">Inactivo / Pausado</p>
                <p id="mic-transcript" class="text-xs text-sky-400 italic truncate w-full">Esperando iniciar...</p>
            </div>
        </div>

        <!-- Panel Derecho: Letras -->
        <div class="w-full lg:w-2/3 bg-slate-800/40 backdrop-blur rounded-2xl border border-slate-700 p-6 flex flex-col shadow-2xl relative overflow-hidden">
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-6 border-b border-slate-700/50 pb-2 text-center">🎤 Sigue la letra</h2>
            
            <div id="lyrics-display" class="lyric-container flex-1 flex flex-col items-center text-center pb-40 pt-10">
                <div class="text-xl text-slate-500 opacity-50 font-medium">Configura el video y presiona Iniciar.</div>
            </div>
        </div>
    </main>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // Letra por defecto Cielito Lindo (para pruebas rápidas)
        const defaultLRC = `[00:14.00]De la sierra morena
[00:18.00]Cielito lindo vienen bajando
[00:24.00]Un par de ojitos negros
[00:28.00]Cielito lindo de contrabando
[00:34.00]Ay ay ay ay
[00:40.00]Canta y no llores
[00:45.00]Porque cantando se alegran
[00:49.00]Cielito lindo los corazones`;
        
        document.getElementById('input-lrc').value = defaultLRC;
        document.getElementById('btn-clear').addEventListener('click', () => document.getElementById('input-lrc').value = '');

        // --- Estado Global ---
        let player = null;
        let isYouTubeReady = false;
        let syncLoopId = null;
        let activeLineIndex = -1;

        // Estructura de letras
        let parsedLyrics = []; // [{ time: float, dom: node, words: [{ text, norm, hit, el }] }]
        
        // Puntuación
        let totalWordsExpected = 0;
        let totalHits = 0;
        let totalScoreSum = 0;

        // Elementos DOM
        const DOM = {
            inputYt: document.getElementById('input-yt'),
            inputLrc: document.getElementById('input-lrc'),
            btnStart: document.getElementById('btn-start'),
            videoPlaceholder: document.getElementById('video-placeholder'),
            playerDiv: document.getElementById('player'),
            lyricsDisplay: document.getElementById('lyrics-display'),
            uiScore: document.getElementById('ui-score'),
            uiHits: document.getElementById('ui-hits'),
            
            micPanel: document.getElementById('mic-panel'),
            micDot: document.getElementById('mic-dot'),
            micStatusText: document.getElementById('mic-status-text'),
            micTranscript: document.getElementById('mic-transcript')
        };

        // --- Configuración de YouTube ---
        function onYouTubeIframeAPIReady() { isYouTubeReady = true; }

        function extractVideoID(url) {
            const match = url.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i);
            return match ? match[1] : null;
        }

        // --- STREAMING_CHUNK: Levenshtein & Utilities ---
        function getSimilarity(s1, s2) {
            if (s1 === s2) return 1.0;
            if (!s1 || !s2) return 0.0;
            const len1 = s1.length, len2 = s2.length;
            const matrix = Array(len2 + 1).fill().map(() => Array(len1 + 1).fill(0));
            for (let i = 0; i <= len1; i++) matrix[0][i] = i;
            for (let j = 0; j <= len2; j++) matrix[j][0] = j;
            for (let j = 1; j <= len2; j++) {
                for (let i = 1; i <= len1; i++) {
                    if (s1[i - 1] === s2[j - 1]) matrix[j][i] = matrix[j - 1][i - 1];
                    else matrix[j][i] = Math.min(matrix[j - 1][i - 1] + 1, matrix[j][i - 1] + 1, matrix[j - 1][i] + 1);
                }
            }
            return 1 - (matrix[len2][len1] / Math.max(len1, len2));
        }

        function normalizeStr(str) {
            return str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9ñ]/g, '');
        }

        // --- STREAMING_CHUNK: Microhone Logic (Highly Resilient) ---
        let recognition = null;
        let keepMicAlive = false; // Indica si el micrófono DEBERÍA estar encendido
        let isRecognizing = false; // Indica el estado real del micrófono

        function initSpeechRecognition() {
            window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!window.SpeechRecognition) {
                updateMicUI("Navegador No Soportado", "red");
                alert("Tu navegador no soporta Reconocimiento de Voz. Usa Chrome o Edge.");
                return;
            }

            recognition = new window.SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'es-MX';

            recognition.onstart = function() {
                isRecognizing = true;
                updateMicUI("🎤 Escuchando...", "green");
            };

            recognition.onresult = function(event) {
                let interim = '';
                let final = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) final += event.results[i][0].transcript;
                    else interim += event.results[i][0].transcript;
                }
                
                const transcript = final || interim;
                DOM.micTranscript.textContent = transcript;
                evaluateLyrics(transcript);
            };

            recognition.onerror = function(event) {
                console.warn("Mic Error:", event.error);
                
                if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                    // Errores fatales de permisos
                    keepMicAlive = false;
                    isRecognizing = false;
                    updateMicUI("Permiso Denegado", "red");
                    alert("Asegúrate de dar permisos de micrófono en la barra del navegador.");
                } else if (event.error === 'no-speech' || event.error === 'audio-capture' || event.error === 'network') {
                    // Errores "suaves" (pasan cuando hay silencio en un karaoke)
                    // Ignoramos y dejamos que el evento onend se encargue de reiniciar
                    updateMicUI("Reconectando (Silencio)...", "yellow");
                }
            };

            recognition.onend = function() {
                isRecognizing = false;
                
                if (keepMicAlive) {
                    // LOOP DE AUTO-REINICIO: Si el video sigue reproduciéndose, forzamos el reinicio
                    updateMicUI("Reiniciando Motor...", "yellow");
                    
                    setTimeout(() => {
                        if (keepMicAlive && !isRecognizing) {
                            try {
                                recognition.start();
                                console.log("Mic auto-restarted.");
                            } catch (e) {
                                console.error("Error on force start:", e);
                            }
                        }
                    }, 250); // Breve delay para no saturar el navegador
                } else {
                    updateMicUI("Inactivo / Pausado", "slate");
                    DOM.micTranscript.textContent = "...";
                }
            };
        }

        function updateMicUI(text, color) {
            DOM.micStatusText.textContent = text;
            DOM.micDot.className = "w-3 h-3 rounded-full z-10 transition-colors duration-300 absolute";
            DOM.micDot.parentElement.className = "relative flex items-center justify-center w-4 h-4"; // reset ping

            if (color === "green") {
                DOM.micPanel.className = "bg-emerald-900/20 border border-emerald-500/50 rounded-2xl p-4 transition-colors duration-300";
                DOM.micDot.classList.add("bg-emerald-500");
                DOM.micDot.parentElement.classList.add("mic-listening-ping");
            } else if (color === "yellow") {
                DOM.micPanel.className = "bg-yellow-900/20 border border-yellow-500/50 rounded-2xl p-4 transition-colors duration-300";
                DOM.micDot.classList.add("bg-yellow-500");
            } else if (color === "red") {
                DOM.micPanel.className = "bg-red-900/20 border border-red-500/50 rounded-2xl p-4 transition-colors duration-300";
                DOM.micDot.classList.add("bg-red-500");
            } else {
                DOM.micPanel.className = "bg-slate-800 border border-slate-700 rounded-2xl p-4 transition-colors duration-300";
                DOM.micDot.classList.add("bg-slate-500");
            }
        }

        // --- STREAMING_CHUNK: Main Execution Logic ---
        DOM.btnStart.addEventListener('click', async () => {
            const videoId = extractVideoID(DOM.inputYt.value);
            const lrcText = DOM.inputLrc.value.trim();

            if (!videoId) return alert("Por favor ingresa un enlace de YouTube válido.");
            if (!lrcText) return alert("Pega la letra en formato LRC.");
            if (!lrcText.includes('[')) return alert("La letra no tiene el formato LRC correcto [mm:ss.xx].");

            // Preparar Letras
            parseLrcToDom(lrcText);
            
            // Inicializar Voz si no existe
            if (!recognition) initSpeechRecognition();

            // Preparar Video
            DOM.videoPlaceholder.style.display = 'none';
            DOM.playerDiv.classList.remove('hidden');

            if (player) {
                player.loadVideoById(videoId);
            } else {
                player = new YT.Player('player', {
                    height: '100%', width: '100%', videoId: videoId,
                    playerVars: { 'playsinline': 1, 'controls': 1 },
                    events: {
                        'onReady': (e) => e.target.playVideo(),
                        'onStateChange': onPlayerStateChange
                    }
                });
            }
        });

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                // Iniciar Auto-Sync de Letras
                syncLoopId = requestAnimationFrame(lyricsSyncLoop);
                
                // Iniciar/Mantener vivo el micrófono
                keepMicAlive = true;
                if (recognition && !isRecognizing) {
                    try { recognition.start(); } catch(e){}
                }
            } else {
                // Video en Pausa, Buffering o Terminado
                cancelAnimationFrame(syncLoopId);
                
                // Detener micrófono amablemente
                keepMicAlive = false;
                if (recognition && isRecognizing) {
                    recognition.stop();
                }
            }
        }

        // --- STREAMING_CHUNK: Lyrics Parsing and Sync ---
        function parseLrcToDom(lrcText) {
            DOM.lyricsDisplay.innerHTML = '';
            parsedLyrics = [];
            totalWordsExpected = 0;
            totalHits = 0;
            totalScoreSum = 0;
            activeLineIndex = -1;
            DOM.uiHits.textContent = "0";
            DOM.uiScore.textContent = "0";

            const lines = lrcText.split('\n');
            const timeRegex = /\[(\d{2}):(\d{2}(?:\.\d{2,3})?)\](.*)/;

            lines.forEach((line, index) => {
                const match = line.match(timeRegex);
                if (match) {
                    const timeInSeconds = (parseInt(match[1]) * 60) + parseFloat(match[2]);
                    const rawLineText = match[3].trim();
                    if (!rawLineText) return;

                    const lineDiv = document.createElement('div');
                    lineDiv.className = "line-wrapper flex flex-wrap justify-center gap-x-3 gap-y-2 w-full max-w-3xl";
                    
                    const wordsObjArray = [];
                    
                    // Solo parsear para puntuar si no es instrumental
                    if (!rawLineText.startsWith('(') && !rawLineText.startsWith('[')) {
                        const words = rawLineText.split(/\s+/);
                        words.forEach(w => {
                            const clean = normalizeStr(w);
                            if (clean) {
                                const span = document.createElement('span');
                                span.textContent = w;
                                span.className = "word word-pending text-3xl md:text-5xl lg:text-6xl font-black";
                                lineDiv.appendChild(span);
                                
                                wordsObjArray.push({ raw: w, norm: clean, hit: false, el: span });
                                totalWordsExpected++;
                            }
                        });
                    } else {
                        // Instrumentales o notas
                        lineDiv.innerHTML = `<span class="text-sky-400/80 italic text-2xl md:text-4xl font-medium">${rawLineText}</span>`;
                    }

                    DOM.lyricsDisplay.appendChild(lineDiv);
                    parsedLyrics.push({ time: timeInSeconds, dom: lineDiv, words: wordsObjArray });
                }
            });

            // Espaciador final para scroll
            const spacer = document.createElement('div');
            spacer.className = "h-64 w-full";
            DOM.lyricsDisplay.appendChild(spacer);
        }

        function lyricsSyncLoop() {
            if (!player) return;
            const currentTime = player.getCurrentTime();

            let targetIndex = -1;
            for (let i = parsedLyrics.length - 1; i >= 0; i--) {
                if (currentTime >= parsedLyrics[i].time - 0.3) { // 300ms look-ahead para mejor feeling visual
                    targetIndex = i;
                    break;
                }
            }

            if (targetIndex !== -1 && targetIndex !== activeLineIndex) {
                // Procesar línea que acaba de pasar (marcar errores)
                if (activeLineIndex !== -1) {
                    const oldLine = parsedLyrics[activeLineIndex];
                    oldLine.dom.classList.remove('line-active');
                    oldLine.words.forEach(w => {
                        if (!w.hit) w.el.classList.replace('word-pending', 'word-miss');
                    });
                }

                // Activar nueva línea
                activeLineIndex = targetIndex;
                const newLine = parsedLyrics[activeLineIndex];
                newLine.dom.classList.add('line-active');

                // Auto Scroll centrado
                const containerHalfHeight = DOM.lyricsDisplay.clientHeight / 2;
                const elementTop = newLine.dom.offsetTop;
                const elementHalfHeight = newLine.dom.clientHeight / 2;
                DOM.lyricsDisplay.scrollTo({
                    top: elementTop - containerHalfHeight + elementHalfHeight,
                    behavior: 'smooth'
                });
            }

            syncLoopId = requestAnimationFrame(lyricsSyncLoop);
        }

        // --- STREAMING_CHUNK: Evaluation Logic ---
        function evaluateLyrics(transcript) {
            if (activeLineIndex === -1) return;
            const activeLine = parsedLyrics[activeLineIndex];
            if (!activeLine || activeLine.words.length === 0) return;

            const spokenTokens = normalizeStr(transcript).split(/\s+/);

            spokenTokens.forEach(spoken => {
                if (spoken.length < 2) return;

                // Buscar dentro de las palabras pendientes de la línea activa
                for (let i = 0; i < activeLine.words.length; i++) {
                    const targetWord = activeLine.words[i];
                    
                    if (!targetWord.hit) {
                        const sim = getSimilarity(spoken, targetWord.norm);
                        const threshold = targetWord.norm.length <= 3 ? 0.85 : 0.70;

                        if (sim >= threshold) {
                            targetWord.hit = true;
                            targetWord.el.classList.replace('word-pending', 'word-hit');
                            
                            // Sumar Stats
                            totalHits++;
                            totalScoreSum += sim;
                            
                            // Calcular porcentaje en vivo
                            const progressScore = Math.min(100, Math.round((totalScoreSum / totalWordsExpected) * 100));
                            
                            DOM.uiHits.textContent = totalHits;
                            DOM.uiScore.textContent = progressScore;
                            
                            break; // Se adivinó esta palabra, pasar al siguiente token hablado
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
