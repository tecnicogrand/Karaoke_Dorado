<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karaoke Dorado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;0,900;1,900&display=swap');
        
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #050505;
            color: white;
            overflow: hidden; 
        }

        /* */
        .glass-panel {
            background: rgba(10, 10, 20, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
        }

        /* */
        .lyric-line { text-align: center; }
        
        .lyric-active {
            font-size: 3.5rem;
            line-height: 1.2;
            font-weight: 900;
            filter: drop-shadow(0px 8px 16px rgba(0,0,0,0.9));
            transition: color 0.3s ease;
        }

        .lyric-word {
            color: rgba(255, 255, 255, 0.25); 
            transition: color 0.1s ease, text-shadow 0.1s ease;
            display: inline-block;
            -webkit-text-stroke: 1px rgba(255,255,255,0.1);
        }

        .lyric-word.filled {
            color: #00f0ff; 
            text-shadow: 0 0 10px #00f0ff, 0 0 20px #00f0ff, 0 0 40px rgba(0, 240, 255, 0.6);
            -webkit-text-stroke: 0px;
        }

        .lyric-active.success .lyric-word.filled {
            color: #ff00ea !important;
            text-shadow: 0 0 10px #ff00ea, 0 0 20px #ff00ea, 0 0 40px rgba(255, 0, 234, 0.8) !important;
        }

        .lyric-next {
            color: rgba(255, 255, 255, 0.3);
            font-size: 1.8rem;
            font-weight: 700;
            margin-top: 1rem;
        }

        /* */
        .lyric-prev-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .lyric-prev-container.show {
            opacity: 1;
            transform: translateY(0);
        }

        .lyric-prev {
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.5rem;
            font-weight: 700;
        }

        .badge {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            box-shadow: 0 0 15px currentColor;
        }
        .badge-perfect { color: #fbbf24; background: rgba(251,191,36,0.15); border: 1px solid #fbbf24; }
        .badge-excellent { color: #ff00ea; background: rgba(255,0,234,0.15); border: 1px solid #ff00ea; }
        .badge-good { color: #00f0ff; background: rgba(0,240,255,0.15); border: 1px solid #00f0ff; }
        .badge-miss { color: #ef4444; background: rgba(239,68,68,0.15); border: 1px solid #ef4444; box-shadow: none; }

        /* */
        #youtube-player-container {
            position: fixed; top: 50%; left: 50%; width: 120vw; height: 120vh;
            transform: translate(-50%, -50%); z-index: -2; pointer-events: none;
        }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle, rgba(10,10,20,0.6) 0%, rgba(5,5,10,0.95) 100%);
            z-index: -1;
        }

        .idle-hide { opacity: 0; transition: opacity 0.5s ease; pointer-events: none; }
        .idle-show { opacity: 1; transition: opacity 0.5s ease; }
        
        .loader {
            border: 4px solid rgba(0,240,255,0.1); border-left-color: #00f0ff;
            border-radius: 50%; width: 60px; height: 60px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .floating-score {
            position: absolute; color: #fbbf24; font-size: 3rem; font-weight: 900;
            filter: drop-shadow(0 0 15px rgba(251, 191, 36, 1));
            animation: floatUp 1s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none; z-index: 50;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.5); }
            100% { opacity: 0; transform: translateY(-120px) scale(1.5); }
        }

        #countdown-overlay { background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); }
        .countdown-number {
            font-size: 15rem; font-weight: 900; color: #00f0ff;
            text-shadow: 0 0 40px #00f0ff;
            animation: pulseBeat 1s infinite;
        }
        @keyframes pulseBeat { 0% { transform: scale(0.8); opacity: 0.5; } 50% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(0.8); opacity: 0.5; } }
    </style>
</head>

    <script>
        let lrcData = [];
        let recognition = null;
        let currentLineIndex = -1;
        let player;
        let videoId = "";
        let syncOffset = 0; 
        let animationFrameId;
        
        let score = 0;
        let combo = 1;
        let currentLineMaxPoints = 0; 
        let lastLineHitRatio = 0;
        
        let stats = { hits: 0, misses: 0, totalRatio: 0, evaluatedLines: 0 };

        let lastYTTime = 0;
        let lastPerformanceTime = performance.now();
        let micMonitorTimeout;
        let isPaused = false;
        let isCountingDown = false;
        let isMicMonitorVisible = true;
        
        // Elementos UI agrupados
        const ui = {
            setup: document.getElementById('setup-screen'),
            load: document.getElementById('loading-screen'),
            karaoke: document.getElementById('karaoke-screen'),
            results: document.getElementById('results-screen'),
            overlay: document.getElementById('start-overlay'),
            loadTxt: document.getElementById('loading-text'),
            curLyric: document.getElementById('current-lyric'),
            nxtLyric: document.getElementById('next-lyric'),
            prevBox: document.getElementById('prev-lyric-box'),
            prevText: document.getElementById('prev-lyric-text'),
            prevBadge: document.getElementById('prev-lyric-badge'),
            syncDisp: document.getElementById('sync-display'),
            controls: document.getElementById('controls-panel'),
            hud: document.getElementById('hud-panel'),
            scoreDisp: document.getElementById('score-display'),
            comboDisp: document.getElementById('combo-display'),
            floatingContainer: document.getElementById('floating-score-container'),
            micMonitor: document.getElementById('mic-monitor'),
            micText: document.getElementById('mic-text'),
            btnToggleMic: document.getElementById('btn-toggle-mic'),
            btnPause: document.getElementById('btn-pause'),
            countdownOverlay: document.getElementById('countdown-overlay'),
            countdownText: document.getElementById('countdown-text')
        };
        
        const btnToggleAi = document.getElementById('btn-toggle-ai');
        const aiSetup = document.getElementById('ai-setup');
        const btnFetchAi = document.getElementById('btn-fetch-ai');

        btnToggleAi.addEventListener('click', () => {
            aiSetup.classList.toggle('hidden');
        });

        function extractVideoId(url) {
            const regex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i;
            const match = url.match(regex);
            return match ? match[1] : null;
        }

        async function fetchVideoTitle(vidId) {
            try {
                const response = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${vidId}`);
                const data = await response.json();
                return data.title || "Canción Desconocida";
            } catch (e) {
                return "Canción Desconocida";
            }
        }

        async function fetchLyricsFromPublicDB(autoTitle, manualQuery) {
            let searchQuery = manualQuery.trim();
            if (!searchQuery) {
                let cleanTitle = autoTitle.replace(/\([^)]*\)|\[[^\]]*\]/g, ' ');
                const stopWords = ['official', 'video', 'oficial', 'lyrics', 'lyric', 'letra', 'audio', 'remastered', '4k', 'hd', 'feat.', 'ft.', 'remix', 'music'];
                const regex = new RegExp(`\\b(${stopWords.join('|')})\\b`, 'gi');
                searchQuery = cleanTitle.replace(regex, ' ').replace(/[-|&]/g, ' ').replace(/\s{2,}/g, ' ').trim();
            }
            if (!searchQuery) throw new Error("Título confuso. Escribe la canción manualmente.");

            const response = await fetch(`https://lrclib.net/api/search?q=${encodeURIComponent(searchQuery)}`);
            if (!response.ok) throw new Error("Error contactando la base de datos.");
            const data = await response.json();
            
            const track = data.find(t => t.syncedLyrics);
            if (!track) throw new Error(`No se encontró la letra sincronizada.`);
            return track.syncedLyrics;
        }

        async function fetchLyricsFromGemini(title, apiKey) {
            const prompt = `Devuelve la letra de "${title}" en formato LRC puro (ejemplo: [00:15.22] Línea de la canción). No incluyas markdown, introducciones ni comentarios. Solo texto LRC. Tu respuesta debe estar dentro de un campo 'text' en formato JSON.`;
            
            // Volvemos al método estándar y oficial de Gemini
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
            
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: { responseMimeType: "application/json" }
                })
            });

            if (!response.ok) {
                throw new Error(`Tu clave "${apiKey.substring(0,5)}..." fue rechazada. Google requiere una clave que empiece con "AIza".`);
            }
            
            const data = await response.json();
            let rawText = "";
            try {
               const responseObj = JSON.parse(data.candidates[0].content.parts[0].text);
               rawText = responseObj.text || JSON.stringify(responseObj);
            } catch (e) {
               rawText = data.candidates[0].content.parts[0].text;
            }
            
            return rawText.replace(/```lrc/g, '').replace(/```json/g, '').replace(/```/g, '').trim();
        }

        function parseLRC(lrcText) {
            const lines = lrcText.split('\n');
            const result = [];
            const regex = /\[(\d{2}):(\d{2}(?:\.\d{1,3})?)\](.*)/;
            
            lines.forEach(line => {
                const match = line.match(regex);
                if (match) {
                    const minutes = parseInt(match[1]);
                    const seconds = parseFloat(match[2]);
                    const text = match[3].trim();
                    const timeInSeconds = (minutes * 60) + seconds;
                    
                    // Aseguramos que solo suba letras reales, no llaves de JSON que la IA a veces deja
                    if (text !== "" && !text.includes('"text":') && text !== '{' && text !== '}') {
                        result.push({ time: timeInSeconds, text: text.replace(/["]/g, '') });
                    }
                }
            });
            return result.sort((a, b) => a.time - b.time);
        }

        document.getElementById('btn-fetch').addEventListener('click', async () => {
            await startKaraokeProcess(false);
        });

        btnFetchAi.addEventListener('click', async () => {
            const apiKey = document.getElementById('api-key').value.trim();
            if (!apiKey) return alert("Por favor ingresa tu API Key para usar la IA.");
            await startKaraokeProcess(true, apiKey);
        });

        async function startKaraokeProcess(useAI, apiKey = null) {
            const url = document.getElementById('youtube-url').value.trim();
            const manualQ = document.getElementById('manual-query').value.trim();

            if (!url) return alert("Por favor, ingresa el link de YouTube.");
            
            videoId = extractVideoId(url);
            if (!videoId) return alert("Enlace de YouTube no válido.");

            ui.setup.classList.add('hidden');
            ui.load.classList.remove('hidden');
            ui.load.classList.add('flex');

            try {
                ui.loadTxt.innerText = "Obteniendo datos del video...";
                const videoTitle = await fetchVideoTitle(videoId);
                
                let rawLRC = "";
                
                // SISTEMA DE AUTO-RESCATE (FALLBACK)
                if (useAI) {
                    ui.loadTxt.innerText = `Generando IA para: ${videoTitle}...`;
                    try {
                        rawLRC = await fetchLyricsFromGemini(manualQ || videoTitle, apiKey);
                    } catch (iaError) {
                        alert(`❌ IA Falló: ${iaError.message}\n\n🔄 No te preocupes, buscando alternativa gratis en la base de datos pública...`);
                        ui.loadTxt.innerText = "Buscando en servidor alternativo...";
                        rawLRC = await fetchLyricsFromPublicDB(videoTitle, manualQ);
                    }
                } else {
                    ui.loadTxt.innerText = `Buscando letras libres...`;
                    rawLRC = await fetchLyricsFromPublicDB(videoTitle, manualQ);
                }
                
                lrcData = parseLRC(rawLRC);
                if (lrcData.length === 0) throw new Error("El archivo de letras estaba vacío o mal formateado. Intenta con la Búsqueda Manual.");

                ui.loadTxt.innerText = "Cargando escenario...";
                setupYouTubePlayer();

            } catch (error) {
                alert(`Aviso: ${error.message}`);
                ui.load.classList.add('hidden');
                ui.load.classList.remove('flex');
                ui.setup.classList.remove('hidden');
            }
        }

        function setupYouTubePlayer() {
            document.getElementById('youtube-player-container').innerHTML = '<div id="yt-player"></div>';
            player = new YT.Player('yt-player', {
                height: '100%', width: '100%', videoId: videoId,
                playerVars: { 'autoplay': 0, 'controls': 0, 'disablekb': 1, 'fs': 0, 'modestbranding': 1, 'rel': 0 },
                events: { 
                    'onReady': () => {
                        player.setVolume(100); // <--- Ajusta el volumen aquí (0 a 100)
                        ui.load.classList.add('hidden');
                        ui.load.classList.remove('flex');
                        ui.karaoke.classList.remove('hidden');
                        resetGameState();
                    },
                    'onStateChange': (event) => {
                        if (event.data === YT.PlayerState.ENDED) showResultsScreen();
                    }
                }
            });
        }

        function resetGameState() {
            syncOffset = 0; score = 0; combo = 1; updateHUD(); updateSyncDisplay();
            stats = { hits: 0, misses: 0, totalRatio: 0, evaluatedLines: 0 };
            currentLineIndex = -1; currentLineMaxPoints = 0; lastLineHitRatio = 0; isPaused = false;
            ui.curLyric.innerHTML = "<span class='lyric-word'>¡Prepara</span> <span class='lyric-word'>tu</span> <span class='lyric-word'>voz!</span>";
            ui.nxtLyric.innerText = "Presiona READY";
            ui.prevBox.classList.remove('show');
        }

        function updateHUD() {
            ui.scoreDisp.innerText = score;
            ui.comboDisp.innerText = `x${combo}`;
            if (combo === 1 && score > 0) {
                ui.comboDisp.classList.replace('text-yellow-400', 'text-red-500');
                setTimeout(() => ui.comboDisp.classList.replace('text-red-500', 'text-yellow-400'), 500);
            }
        }

        function showFloatingScore(points) {
            const floatEl = document.createElement('div');
            floatEl.className = 'floating-score';
            floatEl.innerText = `+${points}`;
            floatEl.style.left = `calc(50% + ${(Math.random() - 0.5) * 200}px)`;
            ui.floatingContainer.appendChild(floatEl);
            setTimeout(() => floatEl.remove(), 1000);
        }

        function evaluatePreviousLine(text, ratio) {
            ui.prevText.innerText = text;
            ui.prevBadge.className = 'badge'; 
            
            if (ratio >= 0.80) {
                ui.prevBadge.classList.add('badge-perfect');
                ui.prevBadge.innerText = "Perfecto +300";
            } else if (ratio >= 0.50) {
                ui.prevBadge.classList.add('badge-excellent');
                ui.prevBadge.innerText = "Excelente +200";
            } else if (ratio >= 0.30) {
                ui.prevBadge.classList.add('badge-good');
                ui.prevBadge.innerText = "Bien +100";
            } else {
                ui.prevBadge.classList.add('badge-miss');
                ui.prevBadge.innerText = "Fallo";
            }
            
            ui.prevBadge.classList.remove('hidden');
            ui.prevBox.classList.add('show');
        }

        function renderCurrentLineWordByWord(text) {
            ui.curLyric.innerHTML = '';
            ui.curLyric.classList.remove('success');
            const words = text.split(/\s+/);
            
            words.forEach((word, index) => {
                if (word.trim() === '') return;
                const span = document.createElement('span');
                span.className = 'lyric-word';
                span.innerText = word;
                ui.curLyric.appendChild(span);
                if (index < words.length - 1) ui.curLyric.appendChild(document.createTextNode(' '));
            });
        }

        document.getElementById('btn-start-karaoke').addEventListener('click', () => {
            ui.overlay.classList.add('hidden'); 
            ui.hud.classList.remove('hidden'); 
            ui.micMonitor.classList.remove('hidden');
            
            if (!isMicMonitorVisible) ui.micMonitor.style.display = 'none';
            else ui.micMonitor.style.display = 'block';

            player.playVideo(); 
            initMicForScoring(); 
            lastYTTime = player.getCurrentTime(); 
            lastPerformanceTime = performance.now();
            syncLoop(); 
        });

        function syncLoop() {
            if (!isPaused && player && player.getPlayerState && player.getPlayerState() === YT.PlayerState.PLAYING) {
                const currentYTTime = player.getCurrentTime();
                const now = performance.now();
                if (currentYTTime !== lastYTTime) { lastYTTime = currentYTTime; lastPerformanceTime = now; }
                const interpolatedTime = lastYTTime + ((now - lastPerformanceTime) / 1000);
                const finalTime = interpolatedTime + syncOffset;
                
                let newIndex = -1;
                for (let i = 0; i < lrcData.length; i++) {
                    if (finalTime >= lrcData[i].time) newIndex = i; else break;
                }

                if (newIndex !== currentLineIndex && newIndex >= 0) {
                    if (currentLineIndex >= 0) {
                        const lineText = lrcData[currentLineIndex].text;
                        evaluatePreviousLine(lineText, lastLineHitRatio);
                        
                        stats.evaluatedLines++;
                        stats.totalRatio += lastLineHitRatio;

                        if (lastLineHitRatio >= 0.30) {
                            combo++;
                            stats.hits++;
                        } else {
                            stats.misses++;
                            if (lineText.length > 2) combo = 1; 
                        }
                        updateHUD();
                    }

                    currentLineIndex = newIndex;
                    currentLineMaxPoints = 0; 
                    lastLineHitRatio = 0;
                    
                    renderCurrentLineWordByWord(lrcData[currentLineIndex].text);
                    ui.nxtLyric.innerText = lrcData[currentLineIndex + 1] ? lrcData[currentLineIndex + 1].text : "";
                }

                if (currentLineIndex >= 0) {
                    const lineStart = lrcData[currentLineIndex].time;
                    const lineEnd = lrcData[currentLineIndex + 1] ? lrcData[currentLineIndex + 1].time : lineStart + 4;
                    let progress = (finalTime - lineStart) / (lineEnd - lineStart);
                    progress = Math.max(0, Math.min(progress, 1));
                    
                    const wordSpans = ui.curLyric.querySelectorAll('.lyric-word');
                    const wordsToFill = Math.floor(progress * (wordSpans.length + 1)); 

                    wordSpans.forEach((span, idx) => {
                        if (idx < wordsToFill) span.classList.add('filled'); 
                        else span.classList.remove('filled');
                    });
                }
            }
            animationFrameId = requestAnimationFrame(syncLoop);
        }

        ui.btnPause.addEventListener('click', () => {
            if (isCountingDown) return;
            if (!isPaused) {
                player.pauseVideo();
                if(recognition) { try { recognition.stop(); } catch(e){} }
                isPaused = true;
                ui.btnPause.innerHTML = '<i class="fas fa-play mr-2"></i> Reanudar';
                ui.btnPause.className = 'flex-1 px-8 py-3 bg-pink-600 hover:bg-pink-500 rounded-full text-sm font-black text-white shadow-[0_0_15px_rgba(255,0,234,0.4)] transition uppercase tracking-widest flex justify-center items-center';
            } else {
                isCountingDown = true;
                ui.countdownOverlay.classList.remove('hidden');
                let count = 3; ui.countdownText.innerText = count;
                ui.countdownText.style.animation = 'none'; ui.countdownText.offsetHeight; ui.countdownText.style.animation = 'pulseBeat 1s infinite';

                let timer = setInterval(() => {
                    count--;
                    if (count > 0) ui.countdownText.innerText = count;
                    else {
                        clearInterval(timer);
                        ui.countdownOverlay.classList.add('hidden');
                        isCountingDown = false; isPaused = false;
                        ui.btnPause.innerHTML = '<i class="fas fa-pause mr-2"></i> Pausa';
                        ui.btnPause.className = 'flex-1 px-8 py-3 bg-cyan-600 hover:bg-cyan-500 rounded-full text-sm font-black text-white shadow-[0_0_15px_rgba(0,240,255,0.4)] transition uppercase tracking-widest flex justify-center items-center';
                        lastYTTime = player.getCurrentTime(); lastPerformanceTime = performance.now();
                        player.playVideo();
                        if(recognition) { try { recognition.start(); } catch(e){} }
                    }
                }, 1000);
            }
        });

        function updateSyncDisplay() { ui.syncDisp.innerText = `${syncOffset > 0 ? "+" : ""}${syncOffset.toFixed(1)}s`; }
        document.getElementById('btn-sync-m5').addEventListener('click', () => { syncOffset -= 5; updateSyncDisplay(); });
        document.getElementById('btn-sync-m').addEventListener('click', () => { syncOffset -= 0.5; updateSyncDisplay(); });
        document.getElementById('btn-sync-p').addEventListener('click', () => { syncOffset += 0.5; updateSyncDisplay(); });
        document.getElementById('btn-sync-p5').addEventListener('click', () => { syncOffset += 5; updateSyncDisplay(); });

        ui.btnToggleMic.addEventListener('click', () => {
            isMicMonitorVisible = !isMicMonitorVisible;
            if (isMicMonitorVisible) {
                ui.btnToggleMic.innerHTML = '<i class="fas fa-eye mr-2"></i> Mic';
                ui.btnToggleMic.className = 'px-4 py-3 bg-indigo-600 hover:bg-indigo-500 rounded-full text-xs font-black text-white shadow-[0_0_15px_rgba(79,70,229,0.5)] transition uppercase tracking-widest flex items-center justify-center';
                ui.micMonitor.style.display = 'block';
            } else {
                ui.btnToggleMic.innerHTML = '<i class="fas fa-eye-slash mr-2 text-gray-400"></i> Mic';
                ui.btnToggleMic.className = 'px-4 py-3 bg-white/10 hover:bg-white/20 rounded-full text-xs font-black text-gray-300 transition uppercase tracking-widest flex items-center justify-center';
                ui.micMonitor.style.display = 'none';
            }
        });

        document.getElementById('btn-exit').addEventListener('click', () => {
            cancelAnimationFrame(animationFrameId);
            if(player && player.destroy) player.destroy();
            ui.karaoke.classList.add('hidden'); ui.hud.classList.add('hidden'); ui.micMonitor.classList.add('hidden');
            ui.setup.classList.remove('hidden'); ui.overlay.classList.remove('hidden');
            if(recognition) recognition.stop();
        });

        let idleTimer;
        document.addEventListener('mousemove', () => {
            if (!ui.karaoke.classList.contains('hidden')) {
                ui.controls.classList.remove('idle-hide'); ui.controls.classList.add('idle-show');
                clearTimeout(idleTimer);
                idleTimer = setTimeout(() => { ui.controls.classList.remove('idle-show'); ui.controls.classList.add('idle-hide'); }, 3500);
            }
        });

        function initMicForScoring() {
            if (!(window.SpeechRecognition || window.webkitSpeechRecognition)) return;
            try {
                recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
                recognition.lang = 'es-ES'; recognition.continuous = true; recognition.interimResults = true; 
                
                const cleanStr = (s) => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^\w\s]/gi, '').toLowerCase().split(/\s+/).filter(w=>w.length>0);

                recognition.onresult = (event) => {
                    if (isPaused || isCountingDown || currentLineIndex < 0) return;
                    let transcript = "";
                    for (let i = Math.max(0, event.results.length - 3); i < event.results.length; ++i) transcript += event.results[i][0].transcript;
                    
                    ui.micText.innerText = `"${transcript.trim()}"`;
                    if (isMicMonitorVisible) ui.micMonitor.classList.remove('opacity-0');
                    clearTimeout(micMonitorTimeout);
                    micMonitorTimeout = setTimeout(() => { ui.micText.innerText = "..."; ui.micMonitor.classList.add('opacity-0'); }, 2500);

                    const saidWords = cleanStr(transcript);
                    const targetWords = cleanStr(lrcData[currentLineIndex].text);
                    if (targetWords.length === 0) return;

                    let matchCount = 0;
                    targetWords.forEach(targetW => { 
                        if (saidWords.some(saidW => targetW === saidW || (targetW.length > 3 && (saidW.includes(targetW) || targetW.includes(saidW))))) {
                            matchCount++;
                        }
                    });
                    
                    let ratio = matchCount / targetWords.length;
                    
                    if (targetWords.length <= 3) {
                        if (matchCount > 0) ratio = 1.0; 
                        else if (saidWords.length > 0) ratio = 0.5; 
                    }

                    if (ratio > lastLineHitRatio) lastLineHitRatio = ratio;

                    let base = 0;
                    if (lastLineHitRatio >= 0.80) base = 300;
                    else if (lastLineHitRatio >= 0.50) base = 200;
                    else if (lastLineHitRatio >= 0.30) base = 100;

                    let totalPossible = base * combo;
                    let incremental = totalPossible - currentLineMaxPoints;
                    
                    if (incremental > 0) {
                        score += incremental;
                        currentLineMaxPoints = totalPossible;
                        showFloatingScore(incremental);
                        updateHUD();
                        ui.curLyric.classList.add('success');
                    }
                };
                
                recognition.onend = () => { if (!ui.karaoke.classList.contains('hidden') && !isPaused && !isCountingDown) try { recognition.start(); } catch(e){} };
                recognition.start(); 
            } catch(e) {}
        }

        function showResultsScreen() {
            cancelAnimationFrame(animationFrameId);
            if(recognition) { try { recognition.stop(); } catch(e){} }
            isPaused = true;
            
            ui.karaoke.classList.add('hidden');
            ui.hud.classList.add('hidden');
            ui.micMonitor.classList.add('hidden');
            ui.controls.classList.add('hidden');
            
            const finalPercent = stats.evaluatedLines === 0 ? 0 : (stats.totalRatio / stats.evaluatedLines) * 100;
            
            document.getElementById('res-score').innerText = score;
            document.getElementById('res-percent').innerText = finalPercent.toFixed(1) + "%";
            document.getElementById('res-hits').innerText = stats.hits;
            document.getElementById('res-misses').innerText = stats.misses;
            
            ui.results.classList.remove('hidden');
            ui.results.classList.add('flex');
        }

        document.getElementById('btn-play-again').addEventListener('click', () => {
            ui.results.classList.add('hidden');
            ui.results.classList.remove('flex');
            ui.setup.classList.remove('hidden');
            if(player && player.destroy) player.destroy();
        });
    </script>
</body>
</html>
